<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" fill="none" width="100%" height="100%">
  <!-- Emblem: Badshahi Dome & Minaret Silhouette -->
  <g transform="translate(10, 8)">
    <!-- Base Plinth -->
    <rect x="5" y="52" width="50" height="4" rx="2" fill="#0B4632"/>
    <!-- Dome Base -->
    <path d="M12 52 C12 36 22 28 30 14 C38 28 48 36 48 52 Z" fill="#0B4632"/>
    <!-- Finial / Crescent Pin -->
    <line x1="30" y1="14" x2="30" y2="4" stroke="#D4A373" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="30" cy="3" r="2.5" fill="#D4A373"/>
    <!-- Left Minaret -->
    <rect x="2" y="24" width="6" height="28" rx="1.5" fill="#D4A373"/>
    <polygon points="5,18 1,24 9,24" fill="#0B4632"/>
    <circle cx="5" cy="17" r="1.5" fill="#D4A373"/>
    <!-- Right Minaret -->
    <rect x="52" y="24" width="6" height="28" rx="1.5" fill="#D4A373"/>
    <polygon points="55,18 51,24 59,24" fill="#0B4632"/>
    <circle cx="55" cy="17" r="1.5" fill="#D4A373"/>
    <!-- Inner Arch Window -->
    <path d="M24 52 C24 43 27 38 30 38 C33 38 36 43 36 52 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Typography -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#0B4632" letter-spacing="1.2">
    LAHORE
  </text>
  <text x="202" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#C0392B" letter-spacing="1.2">
    CITY HUB
  </text>
  <text x="83" y="55" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="2.8">
    YOUR COMPLETE GUIDE TO LAHORE
  </text>
</svg>
