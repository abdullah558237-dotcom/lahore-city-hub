services:
  - type: web
    name: lahore-city-hub
    runtime: python
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lahore-city-hub-db
          property: connectionString

databases:
  - name: lahore-city-hub-db
    plan: free
    region: singapore
    databaseName: lahore_city_hub
    user: lahore_admin
