<div class="lch-newsletter my-5">
  <div class="container text-center">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <span class="badge bg-warning text-dark fw-bold mb-2 px-3 py-1" style="font-size: 0.78rem;">
          <i class="bi bi-envelope-paper-fill me-1"></i> CIVIC & CULTURAL DIGEST
        </span>
        <h2 class="h3 fw-bold mb-2 text-white">Stay Connected with Lahore</h2>
        <p class="text-white-50 mb-4" style="font-size: 0.95rem;">
          Receive curated weekend cultural guides, seasonal smog alerts, job alerts, and newly verified business openings directly in your inbox.
        </p>

        <form class="d-flex flex-column flex-sm-row gap-2 justify-content-center mb-3" onsubmit="event.preventDefault(); alert('Thank you for subscribing to the Lahore City Hub weekly digest!');">
          <input type="email"
                 class="form-control form-control-lg px-3 py-2 border-0 shadow-sm"
                 placeholder="Enter your personal or business email..."
                 aria-label="Email address for newsletter"
                 required
                 style="font-size: 0.95rem; border-radius: 8px;">
          <button class="btn btn-warning btn-lg fw-bold text-dark px-4 shadow-sm" type="submit" style="border-radius: 8px; font-size: 0.95rem;">
            Subscribe Free
          </button>
        </form>

        <div class="text-white-50 small" style="font-size: 0.78rem;">
          <i class="bi bi-shield-check me-1"></i> Zero spam. Strictly verified civic and cultural updates. Unsubscribe at any time.
        </div>
      </div>
    </div>
  </div>
</div>
