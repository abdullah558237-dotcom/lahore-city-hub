{% if breadcrumbs %}
<nav aria-label="breadcrumb" class="py-2 mb-3">
  <ol class="breadcrumb mb-0" style="font-size: 0.88rem;">
    <li class="breadcrumb-item"><a href="{% url 'core:home' %}" class="text-decoration-none"><i class="bi bi-house-door me-1"></i>Home</a></li>
    {% for crumb in breadcrumbs %}
      {% if forloop.last %}
        <li class="breadcrumb-item active text-truncate" aria-current="page" style="max-width: 250px;">{{ crumb.title }}</li>
      {% else %}
        <li class="breadcrumb-item"><a href="{{ crumb.url }}" class="text-decoration-none">{{ crumb.title }}</a></li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>

<!-- Schema.org BreadcrumbList Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ request.scheme }}://{{ request.get_host }}{% url 'core:home' %}"
    }
    {% for crumb in breadcrumbs %}
    ,{
      "@type": "ListItem",
      "position": {{ forloop.counter|add:1 }},
      "name": "{{ crumb.title|escapejs }}",
      "item": "{% if crumb.url %}{% if '://' in crumb.url %}{{ crumb.url }}{% else %}{{ request.scheme }}://{{ request.get_host }}{{ crumb.url }}{% endif %}{% else %}{{ request.build_absolute_uri }}{% endif %}"
    }
    {% endfor %}
  ]
}
</script>
{% endif %}
