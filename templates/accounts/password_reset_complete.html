{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | Lahore City Hub{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        <div class="p-3 bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width: 70px; height: 70px;">
          <i class="bi bi-shield-check fs-2"></i>
        </div>

        <h1 class="h4 fw-bold text-dark mb-2">Password Successfully Reset!</h1>
        <p class="text-secondary small mb-4">
          Your account password has been updated. You can now sign in using your new credentials.
        </p>

        <div class="d-grid">
          <a href="{% url 'accounts:login' %}" class="btn btn-lch-primary py-2 fw-bold shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Now
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
